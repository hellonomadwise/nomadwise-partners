<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nomadwise Partner Placements</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6F69'/%3E%3Cpath d='M9 22V10l14 12V10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div id="switch"></div>
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Nomadwise · eSIM guides</span>
      <h1>Partner placements</h1>
      <p class="forwho" id="forwho"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="grid" id="grid">
    <div class="col" id="main"><p class="loading">Loading…</p></div>
    <aside class="col rail" id="rail"></aside>
  </div>
</div>
<div class="mbar" id="mbar" hidden><span id="mbar-t"></span><button id="mbar-b">Review selection</button></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="supabase.js"></script>
<script src="app.js"></script>
