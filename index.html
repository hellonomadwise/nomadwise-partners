<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nomadwise Partner Placements</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div id="switch"></div>
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Nomadwise Partners</span>
      <h1>Partner placements</h1>
      <p class="forwho" id="forwho"></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="grid" id="grid">
    <div class="col" id="main"><p class="loading">Loading…</p></div>
    <aside class="col rail" id="rail"></aside>
  </div>
</div>
<div class="mbar" id="mbar" hidden><span id="mbar-t"></span><button id="mbar-b">Review selection</button></div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
